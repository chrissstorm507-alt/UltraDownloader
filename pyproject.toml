[project]
name = "ultradownloader"
version = "1.0.0"
description = "Ultra Quality Video Downloader"
dependencies = [
    "flet",
    "yt-dlp"
]

[tool.flet]
org = "com.baba.ultradownloader"
product = "Ultra Video Downloader"
